name: Public API changes

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Breaking changes
    outputs:
      report: ${{ steps.report.outputs.report }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Each assembly the NuGet packages ship is paired with the changelog that records its breaking changes.
      API_ASSEMBLIES: >-
        netstd/Countly/bin/Release/netstandard2.0/Countly.dll=CHANGELOG.md
        net35/Countly/bin/Release/Countly.dll=CHANGELOG.md
        net45/Countly/bin/Release/Countly.dll=CHANGELOG.md
        ui/Countly.UI.WebView2/bin/Release/net462/Countly.UI.WebView2.dll=ui/Countly.UI.WebView2/CHANGELOG.md
        ui/Countly.UI.WebView2/bin/Release/net8.0-windows/Countly.UI.WebView2.dll=ui/Countly.UI.WebView2/CHANGELOG.md
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0

      - name: Install ApiCompat
        run: dotnet tool install --tool-path "$RUNNER_TEMP/apicompat" Microsoft.DotNet.ApiCompat.Tool --version 8.0.428

      # The first parent of the pull request's merge commit is the base branch it merges into.
      - name: Build the base branch and this pull request
        run: |
          git worktree add "$RUNNER_TEMP/base" HEAD^1
          for tree in "$RUNNER_TEMP/base" "$GITHUB_WORKSPACE"; do
            for project in netstd/Countly/Countly.csproj ui/Countly.UI.WebView2/Countly.UI.WebView2.csproj; do
              dotnet build "$tree/$project" -c Release -p:SignAssembly=false -p:DelaySign=false -p:GenerateDocumentationFile=false
            done
          done

      # PowerShell, because the MSBuild that setup-msbuild puts on the PATH is not found from Git Bash.
      # The runner image has no .NET Framework 4.5 targeting pack, so net45 builds against Microsoft's reference assembly package.
      - name: Build the .NET Framework assemblies of both
        shell: pwsh
        run: |
          $refs = Join-Path $env:RUNNER_TEMP "refs"
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net45 -Version 1.0.3 -ExcludeVersion -OutputDirectory $refs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $net45Targets = Join-Path $refs "Microsoft.NETFramework.ReferenceAssemblies.net45/build/Microsoft.NETFramework.ReferenceAssemblies.net45.targets"
          foreach ($tree in @("$env:RUNNER_TEMP/base", "$env:GITHUB_WORKSPACE")) {
            foreach ($framework in @("net35", "net45")) {
              nuget restore "$tree/$framework/Countly.sln"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $extra = @()
              if ($framework -eq "net45") { $extra = @("/p:CustomAfterMicrosoftCommonTargets=$net45Targets") }
              msbuild "$tree/$framework/Countly/Countly.csproj" /t:Build /p:Configuration=Release /p:SignAssembly=false `
                /p:DelaySign=false /p:GenerateDocumentationFile=false /v:minimal @extra
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      # ApiCompat exits with 0 when it finds breaking changes, so its output decides.
      - name: Compare the public API with the base branch
        env:
          # The tool targets .NET 6, which the runner no longer has.
          DOTNET_ROLL_FORWARD: Major
        run: |
          cd "$RUNNER_TEMP"
          : > breaking.txt
          : > changelogs.txt
          : > added.txt
          for entry in $API_ASSEMBLIES; do
            assembly="${entry%%=*}"
            mkdir -p "head/$(dirname "$assembly")"
            cp "$GITHUB_WORKSPACE/$assembly" "head/$assembly"
            if ! ./apicompat/apicompat --left-assembly "base/$assembly" --right-assembly "head/$assembly" > compat.log 2>&1 \
                || ! grep -q -e 'ran successfully' -e 'breaking changes found' compat.log; then
              cat compat.log
              echo "::error::Could not compare the public API of $assembly with the base branch."
              exit 1
            fi
            if grep -E '^CP0[0-9]{3}:' compat.log >> breaking.txt; then
              echo "${entry#*=}" >> changelogs.txt
            fi
            if ! ./apicompat/apicompat --left-assembly "head/$assembly" --right-assembly "base/$assembly" > added.log 2>&1 \
                || ! grep -q -e 'ran successfully' -e 'breaking changes found' added.log; then
              cat added.log
              echo "::error::Could not list what this pull request adds to the public API of $assembly."
              exit 1
            fi
            # Run the other way round, with the head as the contract: what exists on the head but not on the base is new.
            sed -nE "s/^CP000[12]: (Type|Member) '([^']+)' exists on .*/\1 \2/p" added.log >> added.txt
          done
          sort -u -o added.txt added.txt

      - name: Report the public API changes
        id: report
        run: bash .github/scripts/public_api_report.sh "$RUNNER_TEMP/breaking.txt" "$RUNNER_TEMP/added.txt"

      - name: Require a changelog entry for breaking changes
        run: |
          if [ ! -s "$RUNNER_TEMP/breaking.txt" ]; then
            exit 0
          fi
          missing=""
          while read -r changelog; do
            if git diff --quiet HEAD^1 HEAD -- "$changelog"; then
              missing="$missing $changelog"
            fi
          done < <(sort -u "$RUNNER_TEMP/changelogs.txt")
          if [ -n "$missing" ]; then
            echo "::error title=Breaking API change::This pull request breaks the public API without an entry in:$missing. The job summary lists each break."
            exit 1
          fi
          echo "::warning title=Breaking API change::This pull request breaks the public API. Check that the changelog marks it as a breaking change."

  comment:
    name: Comment the public API changes
    needs: api
    # A fork's or Dependabot's pull request only gets a read-only token, so its report stays in the job summary.
    if: >-
      always() && needs.api.outputs.report != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: ${{ needs.api.outputs.report }}
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- countly-public-api -->"))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f "body=$REPORT" > /dev/null
          elif ! grep -qx 'No public API change.' <<< "$REPORT"; then
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f "body=$REPORT" > /dev/null
          fi
