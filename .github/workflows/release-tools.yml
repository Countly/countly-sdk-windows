name: Release tools

on:
  pull_request:
  push:
    branches: [master, staging]

permissions:
  contents: read

jobs:
  test:
    name: Release tools tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        working-directory: .github/release
        run: python3 -m unittest discover -s tests -t . -v

  lint:
    name: Release workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # actionlint 1.7.12 predates the concurrency queue key GitHub added in May 2026 (rhysd/actionlint#654).
          "$RUNNER_TEMP/actionlint" -ignore 'unexpected key "queue" for "concurrency" section' .github/workflows/release.yml .github/workflows/release-tools.yml .github/workflows/release-on-merge.yml
      - name: zizmor
        run: |
          curl -sSfL -o "$RUNNER_TEMP/zizmor.tar.gz" https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  $RUNNER_TEMP/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zizmor.tar.gz" -C "$RUNNER_TEMP" zizmor
          "$RUNNER_TEMP/zizmor" --offline --min-severity low .github/workflows/release.yml .github/workflows/release-tools.yml .github/workflows/release-on-merge.yml

  tags:
    name: Tags this branch releases
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the version files
        id: tags
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: python3 .github/release/release.py checkout-tags --branch "$BRANCH"

  # The release workflow's build job on every change: what a release of this branch would build, checked the same way.
  checks:
    name: Release checks (${{ matrix.tag }})
    needs: tags
    if: needs.tags.outputs.tags != '[]'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.tags.outputs.tags) }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2.0.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - name: Plan
        env:
          TAG: ${{ matrix.tag }}
        run: python .github/release/release.py plan --tag "$env:TAG" --target dry-run --commit "$env:GITHUB_SHA" --out plan.json
      - name: Version numbers match the tag
        run: python .github/release/release.py check-sources --plan plan.json
      - name: Compile and pack, delay-signed with the Countly public key
        run: python .github/release/release.py build --plan plan.json --work "$env:RUNNER_TEMP/release" --staging staged
      - name: Stage the packages and check their files
        run: python .github/release/release.py stage --plan plan.json --staging staged --commit "$env:GITHUB_SHA" --manifest release-manifest.json
      - name: Check what the release promises integrators
        run: python .github/release/release.py contract --plan plan.json --staging staged --commit "$env:GITHUB_SHA"
      - name: Let .NET Framework on this runner load the delay-signed assemblies
        run: python .github/release/release.py skip-verification
      - name: Clean projects restore and run the staged packages, and the core sends data
        run: python .github/release/release.py consumer --plan plan.json --source staged --staging staged --work "$env:RUNNER_TEMP/consumers"
