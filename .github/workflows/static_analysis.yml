name: Static analysis

on:
  pull_request:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-analyzers:
    name: .NET analyzers
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # Report-only: the findings go to the job summary and never fail the job, only a failed build does.
      - name: Analyze the SDK and the WebView2 UI
        shell: bash
        run: |
          options=(-c Release -p:SignAssembly=false -p:DelaySign=false -p:GenerateDocumentationFile=false -p:TreatWarningsAsErrors=false -p:EnableNETAnalyzers=true -p:AnalysisMode=Recommended)
          mkdir -p "$RUNNER_TEMP/sarif"
          dotnet build netstd/Countly/Countly.csproj "${options[@]}" "-p:ErrorLog=$RUNNER_TEMP/sarif/netstd.sarif%2Cversion%3D2.1"
          dotnet build ui/Countly.UI.WebView2/Countly.UI.WebView2.csproj "${options[@]}" -p:TargetFramework=net8.0-windows -p:BuildProjectReferences=false "-p:ErrorLog=$RUNNER_TEMP/sarif/webview2.sarif%2Cversion%3D2.1"

      - name: Summarize the findings
        shell: bash
        run: python .github/scripts/sarif_summary.py ".NET analyzers" "$RUNNER_TEMP/sarif" >> "$GITHUB_STEP_SUMMARY"
